<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F3">
  <title>LPU FIND — Student Profile & Rewards</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 + ReactDOM + Babel for standalone live preview -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FAF8F3',
            surface: {
              DEFAULT: '#FFFFFF',
              alt: '#F3F1EB',
              raised: '#ECEAE2',
            },
            border: {
              DEFAULT: 'rgba(0, 0, 0, 0.07)',
              subtle: 'rgba(0, 0, 0, 0.07)',
              strong: 'rgba(0, 0, 0, 0.14)',
            },
            'text-primary': '#1C1B18',
            'text-secondary': '#6E6B5F',
            'text-muted': '#A8A49A',
            accent: {
              DEFAULT: '#C96442',
              hover: '#B5572E',
              light: '#F2E8E2',
              subtle: '#FAF0EB',
            },
            success: '#059669',
            warning: '#D97706',
            error: '#DC2626',
            lpu: {
              gold: '#D97706',
              bronze: '#9A5528',
              badge: '#FEF3C7',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            '2xl': '16px',
            'xl': '12px',
            'lg': '8px',
            'md': '6px',
          },
          boxShadow: {
            'card': '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03)',
            'card-hover': '0 4px 12px rgba(0,0,0,0.07)',
            'glow-accent': '0 0 20px rgba(201, 100, 66, 0.25)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF8F3;
      color: #1C1B18;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-canvas text-text-primary min-h-screen antialiased selection:bg-accent selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default student identity matching LPU standard credentials
    const DEFAULT_STUDENT = {
      name: "Prakhar Saraswat",
      regNo: "12204589",
      rollNo: "RK22GHA42",
      course: "B.Tech - Computer Science & Engineering (CSE)",
      school: "School of Computer Science & Engineering",
      semester: "6th Semester",
      academicYear: "3rd Year (Class of 2026)",
      section: "K22GH",
      email: "prakhar.12204589@lpu.in",
      phone: "+91 98765 43210",
      residence: "Hostel BH-4, Room 312",
      campus: "LPU Main Campus, Jalandhar-Delhi G.T. Road",
      avatarBg: "#C96442",
      avatarInitials: "PS",
      memberSince: "August 2023",
      verified: true
    };

    // Reward Perks Catalog available to LPU students
    const DEFAULT_PERKS = [
      {
        id: "perk_umc_review",
        title: "Minor UMC Leniency Review Request",
        points: 450,
        category: "Proctorial Board",
        description: "Submit a formal community karma plea to the Proctorial & UMC Committee for minor disciplinary/attendance infraction leniency.",
        icon: "⚖️",
        color: "bg-red-50 text-red-700 border-red-200",
        available: true
      },
      {
        id: "perk_nss_leader",
        title: "NSS Leader Selection & Recommendation",
        points: 350,
        category: "Leadership & NSS",
        description: "Priority nomination and Faculty Coordinator endorsement for National Service Scheme (NSS) Student Wing Leader post.",
        icon: "🎖️",
        color: "bg-purple-50 text-purple-700 border-purple-200",
        available: true
      },
      {
        id: "perk_free_printing",
        title: "Free Printing at Campus Tuck Shops",
        points: 100,
        category: "Campus Utility",
        description: "Voucher for 100 free pages of black/white printing & binding across all hostel and block tuck shops.",
        icon: "🖨️",
        color: "bg-blue-50 text-blue-700 border-blue-200",
        available: true
      },
      {
        id: "perk_extended_library",
        title: "Extended Borrowing Time for Library Books",
        points: 150,
        category: "Central Library",
        description: "Extends Central Library book issue limit to 6 books with +14 days extra borrow duration & zero overdue fines.",
        icon: "📚",
        color: "bg-amber-50 text-amber-700 border-amber-200",
        available: true
      }
    ];

    // Initial Karma Ledger / Credit Transactions
    const INITIAL_TRANSACTIONS = [
      {
        id: "tx_1",
        title: "Returned Apple AirPods Pro (2nd Gen)",
        location: "Central Library Desk",
        points: 150,
        type: "EARN",
        date: "Yesterday, 3:45 PM",
        refId: "POST-8921"
      },
      {
        id: "tx_2",
        title: "Reported & Handed Over Student ID Card",
        location: "Block 34 Security Office",
        points: 100,
        type: "EARN",
        date: "2 days ago",
        refId: "POST-8874"
      },
      {
        id: "tx_3",
        title: "Redeemed Free Printing at Campus Tuck Shops",
        location: "Block 13 Tuck Shop",
        points: 100,
        type: "REDEEM",
        date: "3 days ago",
        refId: "VOUCH-4412"
      },
      {
        id: "tx_4",
        title: "Reported Found MacBook Charger",
        location: "Science Complex, Rm 204",
        points: 100,
        type: "EARN",
        date: "5 days ago",
        refId: "POST-8810"
      },
      {
        id: "tx_5",
        title: "Campus Samaritan Monthly Bonus",
        location: "LPU Find Community Hub",
        points: 100,
        type: "EARN",
        date: "10 days ago",
        refId: "SYS-BONUS"
      }
    ];

    function App() {
      // Load initial state
      const [student, setStudent] = useState(DEFAULT_STUDENT);
      const [credits, setCredits] = useState(750);
      const [perks, setPerks] = useState(DEFAULT_PERKS);
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
      const [metrics, setMetrics] = useState({
        reportedCount: 14,
        returnedCount: 12,
        successRate: '98%',
        trustScore: '4.9★'
      });

      const [activeTab, setActiveTab] = useState('overview'); // overview, rewards, ledger
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editFormData, setEditFormData] = useState({ ...DEFAULT_STUDENT });
      const [confirmingPerk, setConfirmingPerk] = useState(null);
      const [redeemModalPerk, setRedeemModalPerk] = useState(null);
      const [activeVoucherCode, setActiveVoucherCode] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [copyState, setCopyState] = useState(false);

      // Fetch from backend on load
      useEffect(() => {
        fetch('/api/profile')
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (data) {
              if (data.student) {
                setStudent(data.student);
                setEditFormData(data.student);
              }
              if (data.credits !== undefined) setCredits(data.credits);
              if (data.metrics) setMetrics(data.metrics);
              if (data.perks && data.perks.length > 0) setPerks(data.perks);
              if (data.transactions) setTransactions(data.transactions);
            }
          })
          .catch(() => {
            // Local fallback
            const saved = localStorage.getItem('lpufind_student_profile');
            if (saved) setStudent(JSON.parse(saved));
          });
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text);
        setCopyState(true);
        showToast(`Copied ${label} to clipboard!`);
        setTimeout(() => setCopyState(false), 2000);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        const initials = editFormData.name
          .split(' ')
          .map(n => n[0])
          .join('')
          .toUpperCase()
          .slice(0, 2) || "LP";
        
        const updated = {
          ...editFormData,
          avatarInitials: initials
        };

        try {
          const res = await fetch('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updated)
          });
          if (res.ok) {
            setStudent(updated);
            setIsEditModalOpen(false);
            showToast("Profile details saved to backend database!");
            return;
          }
        } catch (err) {}

        // Fallback
        setStudent(updated);
        localStorage.setItem('lpufind_student_profile', JSON.stringify(updated));
        setIsEditModalOpen(false);
        showToast("Profile details updated!");
      };

      const handleRedeemPerk = async (perk) => {
        if (credits < perk.points) {
          showToast(`Need ${perk.points - credits} more credits to redeem this perk!`);
          return;
        }

        try {
          const res = await fetch('/api/perks/redeem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ perkId: perk.id })
          });
          if (res.ok) {
            const data = await res.json();
            setCredits(data.remainingCredits);
            setTransactions([data.transaction, ...transactions]);
            setActiveVoucherCode(data.voucherCode);
            setRedeemModalPerk(perk);
            return;
          }
        } catch (err) {}

        // Fallback
        const voucher = "LPU-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + perk.points;
        const newCredits = credits - perk.points;
        const newTx = {
          id: "tx_" + Date.now(),
          title: `Redeemed ${perk.title}`,
          location: perk.category,
          points: perk.points,
          type: "REDEEM",
          date: "Just now",
          refId: voucher
        };

        setCredits(newCredits);
        setTransactions([newTx, ...transactions]);
        setActiveVoucherCode(voucher);
        setRedeemModalPerk(perk);
      };

      // Rank and tier calculation based on total karma points
      const getTierInfo = (pts) => {
        if (pts >= 1000) {
          return { name: "Platinum Guardian", level: 4, nextGoal: 1500, color: "text-purple-600 bg-purple-50 border-purple-200" };
        } else if (pts >= 500) {
          return { name: "Campus Champion (Gold)", level: 3, nextGoal: 1000, color: "text-amber-700 bg-amber-50 border-amber-200" };
        } else if (pts >= 250) {
          return { name: "Honorable Finder (Silver)", level: 2, nextGoal: 500, color: "text-slate-700 bg-slate-100 border-slate-200" };
        } else {
          return { name: "Rising Scout (Bronze)", level: 1, nextGoal: 250, color: "text-orange-700 bg-orange-50 border-orange-200" };
        }
      };

      const tier = getTierInfo(credits);
      const progressPercent = Math.min(100, Math.round((credits / tier.nextGoal) * 100));

      return (
        <div className="bg-canvas min-h-screen text-text-primary flex justify-center selection:bg-accent selection:text-white">
          <div className="w-full max-w-2xl min-h-screen bg-canvas flex flex-col sm:border-x sm:border-border sm:shadow-lg relative">
            
            {/* Header Sticky Navigation */}
            <header className="sticky top-0 z-30 bg-surface/95 backdrop-blur-md border-b border-border px-4 py-3 sm:px-6">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <a
                    href="/"
                    aria-label="Back to LPU Find"
                    className="touch-target w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-surface-alt hover:bg-surface-raised border border-border flex items-center justify-center text-text-primary active:scale-90 transition-all shrink-0"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 19l-7-7 7-7" />
                    </svg>
                  </a>

                  <div className="flex items-center gap-2">
                    <svg className="w-6 h-6 text-accent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M4 18L12 6L20 18" />
                      <path d="M12 6L16 12L21 9" />
                      <path d="M8 12L3 15" />
                    </svg>
                    <div>
                      <span className="font-extrabold tracking-tight text-base sm:text-lg block leading-none">LPU FIND</span>
                      <span className="text-[10px] text-text-secondary font-medium tracking-wide uppercase">Campus Student Portal</span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => window.NotificationCenter && window.NotificationCenter.toggleDrawer()}
                    className="touch-target relative inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-alt hover:bg-surface-raised border border-border text-text-primary active:scale-95 transition-all cursor-pointer"
                    aria-label="Open notifications"
                  >
                    <svg className="w-4 h-4 text-text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span className="notif-badge hidden absolute -top-1 -right-1 min-w-[16px] h-[16px] px-1 rounded-full bg-accent text-white text-[9px] font-extrabold flex items-center justify-center ring-1 ring-white">0</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      setEditFormData({ ...student });
                      setIsEditModalOpen(true);
                    }}
                    className="touch-target inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-accent hover:bg-accent-hover text-white active:scale-95 transition-all shadow-sm cursor-pointer"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                    <span>Edit</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="flex-1 px-4 sm:px-6 py-5 space-y-5 pb-16">

              {/* STUDENT HERO CARD (BRAND DNA) */}
              <div className="bg-surface rounded-2xl border border-border p-5 sm:p-6 shadow-card relative overflow-hidden">
                {/* LPU subtle background geometric watermark */}
                <div className="absolute -top-12 -right-12 w-44 h-44 bg-accent/5 rounded-full blur-2xl pointer-events-none" />
                <div className="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                  <svg className="w-28 h-28 text-accent" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 18L12 6L20 18H4Z" />
                  </svg>
                </div>

                <div className="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-5">
                  {/* Student Avatar */}
                  <div className="relative shrink-0">
                    <div className="w-20 h-20 sm:w-22 sm:h-22 rounded-2xl bg-gradient-to-br from-accent to-[#9A4222] text-white flex items-center justify-center font-extrabold text-2xl sm:text-3xl shadow-md border-2 border-surface">
                      {student.avatarInitials}
                    </div>
                    {student.verified && (
                      <div className="absolute -bottom-1 -right-1 bg-emerald-500 text-white rounded-full p-1 border-2 border-surface shadow-sm" title="Verified LPU Student">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                    )}
                  </div>

                  {/* Student Main Credentials */}
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap items-center gap-2 mb-1">
                      <h1 className="text-xl sm:text-2xl font-black text-text-primary tracking-tight">{student.name}</h1>
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Verified Student
                      </span>
                    </div>

                    <p className="text-xs sm:text-sm font-semibold text-text-secondary mb-2">
                      {student.course}
                    </p>

                    <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-text-secondary">
                      <div className="flex items-center gap-1.5">
                        <span className="text-text-muted font-medium">Reg No:</span>
                        <button
                          type="button"
                          onClick={() => copyToClipboard(student.regNo, "Registration No")}
                          className="font-bold text-text-primary hover:text-accent flex items-center gap-1 group"
                        >
                          <span>{student.regNo}</span>
                          <svg className="w-3 h-3 text-text-muted group-hover:text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                          </svg>
                        </button>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <span className="text-text-muted font-medium">Roll:</span>
                        <span className="font-bold text-text-primary">{student.rollNo}</span>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <span className="text-text-muted font-medium">Section:</span>
                        <span className="font-bold text-accent px-1.5 py-0.2 bg-accent/10 rounded font-mono">{student.section}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Info Pills Footer */}
                <div className="mt-4 pt-4 border-t border-border grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-text-secondary">
                  <div className="flex items-center gap-2 truncate">
                    <svg className="w-4 h-4 text-text-muted shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    <span className="truncate">{student.residence}</span>
                  </div>

                  <div className="flex items-center gap-2 truncate">
                    <svg className="w-4 h-4 text-text-muted shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span className="truncate font-mono">{student.email}</span>
                  </div>
                </div>
              </div>

              {/* REWARD CREDIT POINTS HIGHLIGHT CARD */}
              <div className="bg-gradient-to-br from-[#1C1B18] to-[#2D2A24] text-white rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden">
                {/* Decorative glow */}
                <div className="absolute top-0 right-0 w-48 h-48 bg-accent/25 rounded-full blur-3xl pointer-events-none" />
                <div className="absolute -bottom-8 -left-8 w-36 h-36 bg-amber-500/15 rounded-full blur-2xl pointer-events-none" />

                <div className="relative z-10 space-y-4">
                  <div className="flex items-start justify-between">
                    <div>
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold tracking-wider uppercase px-2.5 py-1 rounded-full bg-white/10 text-amber-300 border border-white/10 mb-2">
                        ✨ LPU Find Reward Credits
                      </span>
                      <div className="flex items-baseline gap-2">
                        <span className="text-4xl sm:text-5xl font-black text-white tracking-tight">{credits}</span>
                        <span className="text-accent-light font-bold text-sm">Karma Points</span>
                      </div>
                    </div>

                    <div className="text-right">
                      <span className={`inline-block px-3 py-1 rounded-xl text-xs font-bold ${tier.color} shadow-sm`}>
                        {tier.name}
                      </span>
                      <p className="text-[11px] text-zinc-400 mt-1 font-medium">Rank Tier {tier.level} of 4</p>
                    </div>
                  </div>

                  {/* Level Progress Bar */}
                  <div className="space-y-1.5 pt-1">
                    <div className="flex justify-between text-[11px] text-zinc-300 font-medium">
                      <span>Progress to Next Tier</span>
                      <span className="text-amber-300 font-bold">{credits} / {tier.nextGoal} XP</span>
                    </div>
                    <div className="w-full h-2.5 bg-white/10 rounded-full overflow-hidden p-0.5 border border-white/5">
                      <div
                        className="h-full bg-gradient-to-r from-accent to-amber-400 rounded-full transition-all duration-500"
                        style={{ width: `${progressPercent}%` }}
                      />
                    </div>
                  </div>

                  {/* Lifetime Contribution Metrics */}
                  <div className="grid grid-cols-4 gap-2 pt-3 border-t border-white/10 text-center">
                    <div className="p-2 rounded-xl bg-white/5 backdrop-blur-sm">
                      <span className="block text-base sm:text-lg font-black text-white">14</span>
                      <span className="text-[10px] text-zinc-400 uppercase font-semibold">Reported</span>
                    </div>
                    <div className="p-2 rounded-xl bg-white/5 backdrop-blur-sm">
                      <span className="block text-base sm:text-lg font-black text-emerald-400">12</span>
                      <span className="text-[10px] text-zinc-400 uppercase font-semibold">Returned</span>
                    </div>
                    <div className="p-2 rounded-xl bg-white/5 backdrop-blur-sm">
                      <span className="block text-base sm:text-lg font-black text-amber-300">98%</span>
                      <span className="text-[10px] text-zinc-400 uppercase font-semibold">Success</span>
                    </div>
                    <div className="p-2 rounded-xl bg-white/5 backdrop-blur-sm">
                      <span className="block text-base sm:text-lg font-black text-accent-light">4.9★</span>
                      <span className="text-[10px] text-zinc-400 uppercase font-semibold">Trust</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* NAVIGATION TABS */}
              <div className="grid grid-cols-3 gap-1.5 p-1 bg-surface-raised rounded-xl">
                <button
                  type="button"
                  onClick={() => setActiveTab('overview')}
                  className={`min-h-[40px] px-3 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'overview'
                      ? 'bg-accent text-white shadow-sm'
                      : 'bg-transparent text-text-secondary hover:text-text-primary'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  <span>Student Info</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('rewards')}
                  className={`min-h-[40px] px-3 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'rewards'
                      ? 'bg-accent text-white shadow-sm'
                      : 'bg-transparent text-text-secondary hover:text-text-primary'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                  </svg>
                  <span>Campus Privileges</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('ledger')}
                  className={`min-h-[40px] px-3 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'ledger'
                      ? 'bg-accent text-white shadow-sm'
                      : 'bg-transparent text-text-secondary hover:text-text-primary'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                  </svg>
                  <span>Points History</span>
                </button>
              </div>

              {/* TAB 1: STUDENT ACADEMIC & RESIDENTIAL DETAILS */}
              {activeTab === 'overview' && (
                <div className="space-y-4">
                  
                  {/* Academic Profile Container */}
                  <div className="bg-surface rounded-2xl border border-border p-5 shadow-card space-y-4">
                    <div className="flex items-center justify-between border-b border-border pb-3">
                      <h2 className="text-sm font-bold text-text-primary flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-accent"></span>
                        Academic & University Records
                      </h2>
                      <span className="text-[11px] font-semibold text-text-muted uppercase">LPU UMS Sync</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Department / School</span>
                        <p className="font-semibold text-text-primary">{student.school}</p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Program & Specialization</span>
                        <p className="font-semibold text-text-primary">{student.course}</p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Current Semester</span>
                        <p className="font-semibold text-text-primary">{student.semester} ({student.academicYear})</p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Class Section & Group</span>
                        <p className="font-bold text-accent font-mono">{student.section}</p>
                      </div>
                    </div>
                  </div>

                  {/* Campus Residential & Contact Container */}
                  <div className="bg-surface rounded-2xl border border-border p-5 shadow-card space-y-4">
                    <div className="flex items-center justify-between border-b border-border pb-3">
                      <h2 className="text-sm font-bold text-text-primary flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-600"></span>
                        Campus Contact & Residence
                      </h2>
                      <span className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">Active Resident</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Hostel / Campus Residence</span>
                        <p className="font-semibold text-text-primary">{student.residence}</p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">University Campus</span>
                        <p className="font-semibold text-text-primary">{student.campus}</p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Official University Email</span>
                        <p className="font-mono font-medium text-text-primary flex items-center gap-1.5">
                          <span>{student.email}</span>
                          <button
                            type="button"
                            onClick={() => copyToClipboard(student.email, "Email")}
                            className="text-text-muted hover:text-accent"
                          >
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                          </button>
                        </p>
                      </div>

                      <div className="space-y-1">
                        <span className="text-text-muted font-medium">Mobile Phone (Emergency / SMS)</span>
                        <p className="font-semibold text-text-primary">{student.phone}</p>
                      </div>
                    </div>
                  </div>

                </div>
              )}

              {/* TAB 2: REWARD PERKS & REDEMPTION CENTER */}
              {activeTab === 'rewards' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-text-primary">LPU Campus Privileges & Rewards</h2>
                      <p className="text-xs text-text-secondary">Redeem earned LPU Karma Credits for academic leniency reviews, NSS leadership, and utility perks</p>
                    </div>
                    <div className="px-3 py-1 bg-surface border border-border rounded-xl shadow-sm text-right">
                      <span className="text-[10px] text-text-muted block font-semibold uppercase">Available</span>
                      <span className="text-xs font-black text-accent">{credits} pts</span>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {DEFAULT_PERKS.map((perk) => {
                      const canAfford = credits >= perk.points;
                      return (
                        <div
                          key={perk.id}
                          className="bg-surface border border-border rounded-2xl p-4 sm:p-5 shadow-card hover:border-border-strong transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                        >
                          <div className="flex items-start gap-3.5">
                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0 border ${perk.color}`}>
                              {perk.icon}
                            </div>
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="text-[10px] font-bold uppercase tracking-wider text-text-muted px-2 py-0.5 rounded bg-surface-alt">
                                  {perk.category}
                                </span>
                              </div>
                              <h3 className="text-sm font-bold text-text-primary">{perk.title}</h3>
                              <p className="text-xs text-text-secondary leading-relaxed">{perk.description}</p>
                            </div>
                          </div>

                          <div className="flex items-center justify-between sm:flex-col sm:items-end gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-border">
                            <div className="text-left sm:text-right">
                              <span className="text-base font-black text-text-primary">{perk.points}</span>
                              <span className="text-xs font-semibold text-text-secondary ml-1">Credits</span>
                            </div>

                            <button
                              type="button"
                              onClick={() => setConfirmingPerk(perk)}
                              disabled={!canAfford}
                              className={`touch-target px-4 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all flex items-center gap-1.5 ${
                                canAfford
                                  ? 'bg-accent hover:bg-accent-hover text-white shadow-sm'
                                  : 'bg-surface-raised text-text-muted cursor-not-allowed'
                              }`}
                            >
                              <span>{canAfford ? 'Redeem Perk' : 'Need More Points'}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 3: KARMA LEDGER / TRANSACTION HISTORY */}
              {activeTab === 'ledger' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-text-primary">Credits Ledger</h2>
                      <p className="text-xs text-text-secondary">Complete audit history of karma points earned and redeemed</p>
                    </div>
                    <span className="text-xs font-bold text-text-muted">{transactions.length} Total Logs</span>
                  </div>

                  <div className="bg-surface rounded-2xl border border-border divide-y divide-border shadow-card overflow-hidden">
                    {transactions.map((tx) => {
                      const isEarn = tx.type === 'EARN';
                      return (
                        <div key={tx.id} className="p-4 flex items-center justify-between gap-3 hover:bg-surface-alt/50 transition-colors">
                          <div className="flex items-center gap-3">
                            <div className={`w-9 h-9 rounded-full flex items-center justify-center font-black text-sm shrink-0 ${
                              isEarn ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'
                            }`}>
                              {isEarn ? '+' : '−'}
                            </div>
                            <div>
                              <h4 className="text-xs sm:text-sm font-bold text-text-primary">{tx.title}</h4>
                              <div className="flex items-center gap-2 text-[11px] text-text-muted mt-0.5">
                                <span>{tx.location}</span>
                                <span>•</span>
                                <span>{tx.date}</span>
                              </div>
                            </div>
                          </div>

                          <div className="text-right shrink-0">
                            <span className={`text-sm sm:text-base font-black ${isEarn ? 'text-emerald-600' : 'text-amber-600'}`}>
                              {isEarn ? `+${tx.points}` : `-${tx.points}`} pts
                            </span>
                            <span className="block text-[10px] font-mono text-text-muted">{tx.refId}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </main>

            {/* EDIT PROFILE MODAL */}
            {isEditModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" role="dialog">
                <div className="bg-surface rounded-2xl border border-border p-6 max-w-lg w-full shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
                  <div className="flex items-center justify-between border-b border-border pb-3">
                    <h3 className="text-base font-black text-text-primary">Edit Student Profile</h3>
                    <button
                      type="button"
                      onClick={() => setIsEditModalOpen(false)}
                      className="touch-target w-8 h-8 rounded-full flex items-center justify-center text-text-muted hover:text-text-primary hover:bg-surface-alt"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
                    <div className="space-y-1">
                      <label className="font-bold text-text-secondary">Full Student Name</label>
                      <input
                        type="text"
                        required
                        value={editFormData.name}
                        onChange={(e) => setEditFormData({ ...editFormData, name: e.target.value })}
                        className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-sm focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/15"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Registration Number</label>
                        <input
                          type="text"
                          required
                          value={editFormData.regNo}
                          onChange={(e) => setEditFormData({ ...editFormData, regNo: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Roll Number</label>
                        <input
                          type="text"
                          required
                          value={editFormData.rollNo}
                          onChange={(e) => setEditFormData({ ...editFormData, rollNo: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="font-bold text-text-secondary">Course / Program</label>
                      <input
                        type="text"
                        required
                        value={editFormData.course}
                        onChange={(e) => setEditFormData({ ...editFormData, course: e.target.value })}
                        className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Section</label>
                        <input
                          type="text"
                          required
                          value={editFormData.section}
                          onChange={(e) => setEditFormData({ ...editFormData, section: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Semester / Year</label>
                        <input
                          type="text"
                          required
                          value={editFormData.semester}
                          onChange={(e) => setEditFormData({ ...editFormData, semester: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="font-bold text-text-secondary">Hostel / Campus Room</label>
                      <input
                        type="text"
                        required
                        value={editFormData.residence}
                        onChange={(e) => setEditFormData({ ...editFormData, residence: e.target.value })}
                        className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Official Email</label>
                        <input
                          type="email"
                          required
                          value={editFormData.email}
                          onChange={(e) => setEditFormData({ ...editFormData, email: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="font-bold text-text-secondary">Phone Number</label>
                        <input
                          type="text"
                          required
                          value={editFormData.phone}
                          onChange={(e) => setEditFormData({ ...editFormData, phone: e.target.value })}
                          className="w-full bg-surface border border-border-strong rounded-xl p-3 text-text-primary text-xs focus:outline-none focus:border-accent"
                        />
                      </div>
                    </div>

                    <div className="flex items-center justify-end gap-3 pt-3 border-t border-border">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="touch-target px-4 py-2 rounded-xl text-xs font-bold text-text-secondary bg-surface-alt hover:bg-surface-raised"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="touch-target px-5 py-2 rounded-xl text-xs font-bold bg-accent hover:bg-accent-hover text-white shadow-sm"
                      >
                        Save Changes
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* CONFIRM REDEMPTION POP-UP MODAL */}
            {confirmingPerk && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" role="dialog" aria-modal="true">
                <div className="bg-surface rounded-2xl border border-border p-6 max-w-sm w-full shadow-2xl text-center space-y-4 relative">
                  <div className="w-14 h-14 rounded-2xl bg-accent/10 text-accent flex items-center justify-center text-2xl mx-auto border border-accent/20">
                    {confirmingPerk.icon || '🎁'}
                  </div>

                  <div className="space-y-1">
                    <span className="text-[10px] uppercase font-bold tracking-widest text-text-muted">
                      Confirm Redemption
                    </span>
                    <h3 className="text-base font-black text-text-primary">{confirmingPerk.title}</h3>
                    <p className="text-xs text-text-secondary">{confirmingPerk.category}</p>
                  </div>

                  {/* Points Breakdown Box */}
                  <div className="bg-surface-alt rounded-xl p-3.5 border border-border space-y-2 text-xs">
                    <div className="flex items-center justify-between text-text-secondary">
                      <span>Points Required:</span>
                      <span className="font-bold text-accent">−{confirmingPerk.points} Karma Credits</span>
                    </div>
                    <div className="flex items-center justify-between text-text-secondary pt-1.5 border-t border-border">
                      <span>Remaining Balance:</span>
                      <span className="font-black text-text-primary">{credits - confirmingPerk.points} Credits</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setConfirmingPerk(null)}
                      className="touch-target min-h-[42px] px-4 py-2 rounded-xl text-xs font-bold text-text-secondary bg-surface-alt hover:bg-surface-raised active:scale-95 transition-all"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const perkToRedeem = confirmingPerk;
                        setConfirmingPerk(null);
                        handleRedeemPerk(perkToRedeem);
                      }}
                      className="touch-target min-h-[42px] px-4 py-2 rounded-xl text-xs font-bold bg-accent hover:bg-accent-hover text-white active:scale-95 transition-all shadow-sm"
                    >
                      Confirm & Redeem
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* VOUCHER REDEEM SUCCESS MODAL */}
            {activeVoucherCode && redeemModalPerk && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" role="dialog">
                <div className="bg-surface rounded-2xl border border-border p-6 max-w-sm w-full shadow-2xl text-center space-y-4 relative overflow-hidden">
                  <div className="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                    🎉
                  </div>

                  <div className="space-y-1">
                    <span className="text-[10px] uppercase font-bold tracking-widest text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
                      Voucher Generated
                    </span>
                    <h3 className="text-lg font-black text-text-primary">{redeemModalPerk.title}</h3>
                    <p className="text-xs text-text-secondary">{redeemModalPerk.description}</p>
                  </div>

                  {/* Voucher Pass Card */}
                  <div className="bg-surface-alt border-2 border-dashed border-accent/40 rounded-xl p-4 space-y-2">
                    <span className="text-[10px] text-text-muted uppercase font-semibold">Show this voucher code at desk</span>
                    <div className="font-mono text-xl font-black text-accent tracking-wider select-all">
                      {activeVoucherCode}
                    </div>
                    <span className="text-[10px] text-text-secondary block">Deducted {redeemModalPerk.points} Karma Credits</span>
                  </div>

                  <div className="pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setActiveVoucherCode(null);
                        setRedeemModalPerk(null);
                        showToast("Voucher added to your active rewards!");
                      }}
                      className="w-full touch-target min-h-[44px] bg-accent hover:bg-accent-hover text-white text-xs font-bold rounded-xl active:scale-95 transition-all shadow-sm flex items-center justify-center"
                    >
                      Done & Save Voucher
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TOAST NOTIFICATION */}
            {toastMessage && (
              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#1C1B18] text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2 border border-white/10">
                <span>✓</span>
                <span>{toastMessage}</span>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script src="/components/notification-center.js"></script>
</body>
</html>
