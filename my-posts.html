    function EditForm({ post, onSave, onCancel }) {
      const [title, setTitle] = useState(post.title || '');

      const [description, setDescription] = useState(post.description || '');

      const categories = ['Electronics', 'Documents', 'Bags', 'Accessories', 'Other'];

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          title: title.trim(),
          category,
          location: location.trim(),
          description: description.trim(),
        });
      };

      return (
        <form onSubmit={handleSubmit} className="mt-3 pt-3 border-t border-black/7 space-y-3">

            <label className="block text-xs font-bold text-[#6E6B5F] mb-1">Title</label>
            <input
              type="text"
              required
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="Item title"
              className="w-full bg-white border border-black/14 text-[#1C1B18] placeholder-[#A8A49A] rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#C96442] focus:ring-2 focus:ring-[#C96442]/15"
            />

              <label className="block text-xs font-bold text-[#6E6B5F] mb-1">Category</label>

                onChange={(e) => setCategory(e.target.value)}
                className="w-full bg-white border border-black/14 text-[#1C1B18] rounded-lg p-2.5 text-xs focus:outline-none focus:border-[#C96442]"

            </div>

              <label className="block text-xs font-bold text-[#6E6B5F] mb-1">Location</label>

                type="text"

                value={location}

                className="w-full bg-white border border-black/14 text-[#1C1B18] placeholder-[#A8A49A] rounded-lg p-2.5 text-xs focus:outline-none focus:border-[#C96442]"

            <label className="block text-xs font-bold text-[#6E6B5F] mb-1">Description</label>

              rows={2}

              className="w-full bg-white border border-black/14 text-[#1C1B18] placeholder-[#A8A49A] rounded-lg p-2 text-xs focus:outline-none focus:border-[#C96442] resize-none"

                  </svg>

              >
                <svg className="w-4 h-4 text-[#DC2626]" fill="none" viewBox="0 0 24 24" stroke="currentColor">

    function ClaimsDrawer({ isOpen, onClose, post, onApproveClaim, onRejectClaim }) {
      const [touchStartY, setTouchStartY] = useState(0);
      const [touchCurrentY, setTouchCurrentY] = useState(0);
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      if (!isOpen || !post) return null;

      const handleTouchStart = (e) => {
        setTouchStartY(e.touches[0].clientY);
        setTouchCurrentY(e.touches[0].clientY);
        setIsDragging(true);
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const currentY = e.touches[0].clientY;
        if (currentY > touchStartY) setTouchCurrentY(currentY);
      };

      const handleTouchEnd = () => {
        if (!isDragging) return;
        setIsDragging(false);
        const dragDelta = touchCurrentY - touchStartY;
        if (dragDelta > 100) onClose();
        setTouchStartY(0);
        setTouchCurrentY(0);
      };

      const dragOffset = isDragging && touchCurrentY > touchStartY ? touchCurrentY - touchStartY : 0;
      const claims = post.claim_requests || [];

      const getStatusPill = (status) => {
        switch (status) {
          case 'APPROVED':
            return <span className="inline-flex items-center rounded-md px-2.5 py-0.5 text-xs font-semibold tracking-wide text-[#059669] bg-[#ECFDF5]">Approved</span>;
          case 'REJECTED':
            return <span className="inline-flex items-center rounded-md px-2.5 py-0.5 text-xs font-semibold tracking-wide text-[#6B7280] bg-[#F9FAFB]">Rejected</span>;
          case 'PENDING':
          default:
            return <span className="inline-flex items-center rounded-md px-2.5 py-0.5 text-xs font-semibold tracking-wide text-[#D97706] bg-[#FFFBEB]">Pending</span>;
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true">
          <div className="fixed inset-0 bg-black/40 transition-opacity" onClick={onClose} />
          <div
            style={dragOffset ? { transform: `translateY(${dragOffset}px)` } : undefined}
            className="relative w-full max-w-md bg-white rounded-t-2xl shadow-2xl flex flex-col max-h-[85vh] z-10 transition-transform duration-150"
          >
            <div
              className="pt-3 pb-2 cursor-grab shrink-0"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <div className="h-1.5 w-12 bg-black/14 rounded-full mx-auto" />
            </div>

            <div
              className="px-5 pb-3 border-b border-black/7 flex items-center justify-between gap-3 shrink-0"
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <div className="min-w-0 flex-1">
                <h2 className="text-base font-bold text-[#1C1B18] truncate">Claims for {post.title}</h2>
                <p className="text-xs text-[#6E6B5F] mt-0.5">{claims.length} {claims.length === 1 ? 'claim' : 'claims'} submitted</p>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Close claims drawer"
                className="w-11 h-11 min-w-[44px] min-h-[44px] rounded-lg text-[#A8A49A] hover:text-[#1C1B18] hover:bg-[#F3F1EB] active:scale-[0.97] transition-all flex items-center justify-center shrink-0"
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-[calc(1rem+env(safe-area-inset-bottom,0px))]">
              {claims.length === 0 ? (
                <div className="text-center py-12 text-[#6E6B5F] text-sm">No claims submitted for this post.</div>
              ) : (
                claims.map((claim) => (
                  <div
                    key={claim.claim_id}
                    className={`p-3.5 rounded-xl border transition-colors ${
                      claim.status === 'REJECTED' ? 'bg-[#F3F1EB]/50 border-black/7 opacity-75' : 'bg-white border-black/7'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <span className="text-xs font-bold text-[#6E6B5F]">Student #{claim.claimant_id}</span>
                      {getStatusPill(claim.status)}
                    </div>
                    <p className="text-sm text-[#1C1B18] leading-relaxed mb-3">{claim.proof_note}</p>
                    {claim.status === 'PENDING' && (
                      <div className="flex items-center justify-end gap-2 pt-2.5 border-t border-black/7">
                        <button
                          type="button"
                          onClick={() => onRejectClaim(post.post_id, claim.claim_id)}
                          className="min-h-[44px] px-3.5 py-2 text-sm font-semibold text-[#DC2626] hover:underline active:scale-[0.97] transition-transform duration-100 flex items-center justify-center rounded-lg"
                        >
                          Reject
                        </button>
                        <button
                          type="button"
                          onClick={() => onApproveClaim(post.post_id, claim.claim_id)}
                          className="min-h-[44px] min-w-[80px] px-4 py-2 bg-[#C96442] hover:bg-[#B5572E] text-white text-sm font-semibold rounded-lg active:scale-[0.97] transition-transform duration-100 flex items-center justify-center"
                        >
                          Approve
                        </button>
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

      onStartEdit,
      onCancelEdit,
      onStatusChange,
      onEditSave,
      onBump,
      onDeleteClick,
      onViewClaims,
      onOpenActionSheet,
    }) {
      const [isSavedFlash, setIsSavedFlash] = useState(false);
      const pendingClaims = (post.claim_requests || []).filter((c) => c.status === 'PENDING');
      const totalClaims = (post.claim_requests || []).length;

      const now = new Date().getTime();
      const createdTime = new Date(post.created_at).getTime();
      const isOlderThan3Days = now - createdTime > 3 * 24 * 60 * 60 * 1000;
      const isBumpEligible = post.status === 'OPEN' && isOlderThan3Days;

      const handleSave = async (fields) => {
        await onEditSave(post.post_id, fields);
        onCancelEdit();
        setIsSavedFlash(true);
        setTimeout(() => setIsSavedFlash(false), 200);
      };

      const isResolved = post.status === 'RESOLVED';

      return (
        <div
          className={`bg-white border rounded-xl p-4 shadow-sm transition-all duration-200 ${
            isSavedFlash ? 'border-[#059669] ring-2 ring-[#059669]/20' : 'border-black/7 hover:border-black/14'
          }`}
        >
          <div className="flex items-start gap-3.5">
            {post.image_url ? (
              <img src={post.image_url} alt={post.title} className="w-14 h-14 rounded-lg object-cover shrink-0 border border-black/7" />
            ) : (
              <div className="w-14 h-14 rounded-lg bg-[#ECEAE2] flex items-center justify-center shrink-0 border border-black/7">
                <svg className="w-5 h-5 text-[#A8A49A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
            )}

            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1">
                <span className={`inline-flex items-center rounded-md px-2 py-0.5 text-[11px] font-bold tracking-wide ${post.type === 'LOST' ? 'text-[#DC2626] bg-[#FEF2F2]' : 'text-[#059669] bg-[#ECFDF5]'}`}>
                  {post.type}
                </span>
                <StatusBadge status={post.status} />
                <span className="text-[11px] font-medium text-[#A8A49A] ml-auto truncate">{post.category}</span>
              </div>

              <h3 className="text-sm font-semibold text-[#1C1B18] line-clamp-1 leading-snug">{post.title}</h3>
              <p className="text-xs text-[#6E6B5F] truncate mt-0.5 flex items-center gap-1">
                <svg className="w-3 h-3 shrink-0 text-[#A8A49A]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span className="truncate">{post.location}</span>
              </p>

              {pendingClaims.length > 0 && (
                <p className="text-xs font-semibold text-[#C96442] mt-1 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#C96442]" />
                  {pendingClaims.length} Pending Claim{pendingClaims.length > 1 ? 's' : ''}
                </p>
              )}
            </div>
          </div>

          {isEditing && (
            <EditForm post={post} onSave={handleSave} onCancel={onCancelEdit} />
          )}

          {!isEditing && (
            <div className="mt-3 pt-3 border-t border-black/7 flex items-center justify-between gap-2">
              <div className="flex-1">
                {totalClaims > 0 ? (
                  <button
                    type="button"
                    onClick={() => onViewClaims(post)}
                    className="w-full min-h-[44px] px-3 py-2 bg-[#F2E8E2] text-[#C96442] hover:bg-[#ebdcd3] text-sm font-semibold rounded-lg active:scale-[0.97] transition-transform duration-100 flex items-center justify-center gap-1.5"
                  >
                    <span>View Claims</span>
                    <span className="bg-[#C96442] text-white text-[11px] px-1.5 py-0.5 rounded-full font-bold">{totalClaims}</span>
                  </button>
                ) : !isResolved ? (
                  <button
                    type="button"
                    onClick={() => onStatusChange(post.post_id, 'RESOLVED')}
                    className="w-full min-h-[44px] px-4 py-2 bg-[#C96442] hover:bg-[#B5572E] text-white text-sm font-medium rounded-lg active:scale-[0.97] transition-transform duration-100 flex items-center justify-center"
                  >
                    Mark Resolved
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => onStartEdit(post.post_id)}
                    className="w-full min-h-[44px] px-3 py-2 bg-[#F3F1EB] text-[#1C1B18] text-sm font-medium rounded-lg active:scale-[0.97] transition-transform duration-100 flex items-center justify-center"
                  >
                    Edit Details
                  </button>
                )}
              </div>
              <button
                type="button"
                onClick={() => onOpenActionSheet(post)}
                aria-label="More actions"
                className="w-11 h-11 min-w-[44px] min-h-[44px] rounded-lg bg-[#F3F1EB] hover:bg-[#ECEAE2] text-[#6E6B5F] hover:text-[#1C1B18] active:scale-[0.97] transition-transform duration-100 flex items-center justify-center shrink-0"
              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                </svg>
              </button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('active');
      const [isScrolled, setIsScrolled] = useState(false);
      const [editingPostId, setEditingPostId] = useState(null);

      const [deletingPost, setDeletingPost] = useState(null);
      const [claimsDrawerPost, setClaimsDrawerPost] = useState(null);
      const [actionSheetPost, setActionSheetPost] = useState(null);

      useEffect(() => {
        const timer = setTimeout(() => {
          setPosts(INITIAL_POSTS);
          setLoading(false);
        }, 300);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 0);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        if (claimsDrawerPost) {
          const updated = posts.find((p) => p.post_id === claimsDrawerPost.post_id);
          if (updated) setClaimsDrawerPost(updated);
        }
      }, [posts]);

      const patchPostStatus = async (id, status) => {
        await new Promise((resolve) => setTimeout(resolve, 300));
        setPosts((prev) =>
          prev.map((p) => (p.post_id === id ? { ...p, status, updated_at: new Date().toISOString() } : p))
        );
      };

      const patchPostEdit = async (id, fields) => {
        await new Promise((resolve) => setTimeout(resolve, 300));
        setPosts((prev) =>
          prev.map((p) => (p.post_id === id ? { ...p, ...fields, updated_at: new Date().toISOString() } : p))
        );
      };

      const deletePost = async (id) => {
        await new Promise((resolve) => setTimeout(resolve, 300));
        setPosts((prev) => prev.filter((p) => p.post_id !== id));
      };

      const actionClaim = async (postId, claimId, action) => {
        await new Promise((resolve) => setTimeout(resolve, 300));
        let matchedPost = null;
        let matchedClaim = null;

        setPosts((prev) =>
          prev.map((p) => {
            if (p.post_id !== postId) return p;
            matchedPost = p;
            const updatedClaims = (p.claim_requests || []).map((c) => {
              if (c.claim_id !== claimId) return c;
              matchedClaim = c;
              return { ...c, status: action === 'approve' ? 'APPROVED' : 'REJECTED' };
            });
            const nextStatus = action === 'approve' ? 'IN_CLAIM' : p.status;
            return {
              ...p,
              status: nextStatus,
              claim_requests: updatedClaims,
              updated_at: new Date().toISOString(),
            };
          })
        );

        if (action === 'approve' && matchedPost && window.NotificationCenter) {
          window.NotificationCenter.triggerMatch({
            lostItemName: matchedPost.title,
            foundItemName: matchedPost.title,
            ticketId: `POST-${matchedPost.post_id.replace('post_', '')}`,
            location: matchedPost.location,
            matchScore: 98,
            userName: 'Prakhar Saraswat (Post Creator)',
            userPhone: '+91 98765 43210',
            userEmail: 'prakhar.12204589@lpu.in',
            personName: `Student #${matchedClaim?.claimant_id || '552'} (Claimant)`,
            personPhone: '+91 98111 22334',
            personEmail: `student.${matchedClaim?.claimant_id || '552'}@lpu.in`
          });
        }
      };

      const handleBump = async (postId) => {
        const now = new Date().toISOString();
        await patchPostEdit(postId, { updated_at: now });
        setPosts((prev) => {
          const target = prev.find((p) => p.post_id === postId);
          if (!target) return prev;
          const remaining = prev.filter((p) => p.post_id !== postId);
          return [{ ...target, updated_at: now }, ...remaining];
        });
      };

      const handleConfirmDelete = async () => {
        if (!deletingPost) return;
        const targetId = deletingPost.post_id;
        setDeletingPost(null);
        if (claimsDrawerPost?.post_id === targetId) setClaimsDrawerPost(null);
        if (editingPostId === targetId) setEditingPostId(null);
        await deletePost(targetId);
      };

      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('All');

      const activePosts = posts.filter((p) => p.status === 'OPEN' || p.status === 'IN_CLAIM');
      const resolvedPosts = posts.filter((p) => p.status === 'RESOLVED');
      const tabPosts = activeTab === 'active' ? activePosts : resolvedPosts;

      // Filter by search query and category
      const displayedPosts = tabPosts.filter((post) => {
        if (filterCategory !== 'All' && post.category.toLowerCase() !== filterCategory.toLowerCase()) {
          return false;
        }

        const clean = searchQuery.trim().toLowerCase();
        if (!clean) return true;

        const tokens = clean.split(/\s+/).filter(Boolean);
        const searchable = [
          post.title,
          post.category,
          post.location,
          post.description || '',
          post.type,
          post.status
        ].join(' ').toLowerCase();

        return tokens.every((token) => searchable.includes(token));
      });

      const checkBumpEligible = (post) => {
        if (!post || post.status !== 'OPEN') return false;
        const now = new Date().getTime();
        const createdTime = new Date(post.created_at).getTime();
        return now - createdTime > 3 * 24 * 60 * 60 * 1000;
      };

      const categoriesList = ['All', 'Electronics', 'Bags', 'Accessories', 'Documents'];

      return (
        <div className="bg-[#FAF8F3] min-h-screen text-[#1C1B18] flex justify-center">
          <div className="w-full max-w-md min-h-screen bg-[#FAF8F3] flex flex-col sm:border-x sm:border-black/7 sm:shadow-xl relative">
            
            <header className={`sticky top-0 z-20 bg-[#FAF8F3] px-4 pt-4 pb-3 space-y-3 transition-colors duration-150 ${isScrolled ? 'border-b border-black/7 shadow-sm' : ''}`}>
              <div className="flex items-center justify-between gap-3">
                <a href="/lost" className="touch-target text-xs font-semibold text-[#1C1B18] hover:text-[#C96442] flex items-center gap-1.5 bg-[#F3F1EB] hover:bg-[#ECEAE2] px-3 py-1.5 rounded-lg border border-black/7 active:scale-95 transition-all">
                  <svg className="w-4 h-4 text-[#1C1B18]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M15 19l-7-7 7-7" />
                  </svg>
                  <span>LPU FIND</span>
                </a>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => window.NotificationCenter && window.NotificationCenter.toggleDrawer()}
                    className="touch-target relative inline-flex items-center justify-center w-8 h-8 rounded-lg bg-[#F3F1EB] hover:bg-[#ECEAE2] border border-black/7 text-[#1C1B18] active:scale-95 transition-all cursor-pointer"
                    aria-label="Open notifications"
                  >
                    <svg className="w-4 h-4 text-[#1C1B18]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span className="notif-badge hidden absolute -top-1 -right-1 min-w-[16px] h-[16px] px-1 rounded-full bg-[#C96442] text-white text-[9px] font-extrabold flex items-center justify-center ring-1 ring-white">0</span>
                  </button>

                  <a href="/profile" className="touch-target text-xs font-semibold bg-[#C96442] text-white hover:bg-[#B5572E] px-2.5 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1">
                    <div className="w-3.5 h-3.5 rounded-full bg-white/20 flex items-center justify-center text-[8px] font-bold">PS</div>
                    <span>Profile</span>
                  </a>
                  <span className="text-xs font-semibold text-[#6E6B5F] bg-[#ECEAE2] px-2.5 py-1 rounded-full">
                    {posts.length} Posts
                  </span>
                </div>
              </div>

              <div className="flex items-center justify-between">
                <h1 className="text-xl font-bold text-[#1C1B18] tracking-tight">My Posts</h1>
              </div>

              {/* Search Bar within My Posts */}
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#A8A49A]">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search posts (e.g. MacBook charger, bag)..."
                  className="w-full bg-white border border-black/14 text-[#1C1B18] placeholder-[#A8A49A] rounded-xl pl-9 pr-9 py-2 text-xs focus:outline-none focus:border-[#C96442] focus:ring-2 focus:ring-[#C96442]/15 shadow-sm"
                />
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery('')}
                    className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-[#A8A49A] hover:text-[#1C1B18]"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                )}
              </div>

              {/* Category Quick Chips */}
              <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-[11px] scrollbar-none">
                {categoriesList.map((cat) => (
                  <button
                    key={cat}
                    type="button"
                    onClick={() => setFilterCategory(cat)}
                    className={`px-2.5 py-1 rounded-lg font-medium whitespace-nowrap transition-colors ${
                      filterCategory === cat
                        ? 'bg-[#1C1B18] text-white'
                        : 'bg-[#ECEAE2] text-[#6E6B5F] hover:text-[#1C1B18]'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* Active / Resolved Tabs */}
              <div className="grid grid-cols-2 gap-1.5 p-1 bg-[#ECEAE2] rounded-xl">
                <button
                  type="button"
                  onClick={() => { setActiveTab('active'); setEditingPostId(null); }}
                  className={`min-h-[38px] px-3 py-1.5 rounded-lg text-xs font-bold active:scale-[0.97] transition-all duration-100 flex items-center justify-center gap-1.5 ${
                    activeTab === 'active' ? 'bg-[#C96442] text-white shadow-sm' : 'bg-transparent text-[#6E6B5F] hover:text-[#1C1B18]'
                  }`}
                >
                  <span>Active</span>
                  <span className={`text-[11px] px-1.5 py-0.2 rounded-full font-bold ${activeTab === 'active' ? 'bg-white/20 text-white' : 'bg-white text-[#6E6B5F]'}`}>
                    {activePosts.length}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => { setActiveTab('resolved'); setEditingPostId(null); }}
                  className={`min-h-[38px] px-3 py-1.5 rounded-lg text-xs font-bold active:scale-[0.97] transition-all duration-100 flex items-center justify-center gap-1.5 ${
                    activeTab === 'resolved' ? 'bg-[#C96442] text-white shadow-sm' : 'bg-transparent text-[#6E6B5F] hover:text-[#1C1B18]'
                  }`}
                >
                  <span>Resolved</span>
                  <span className={`text-[11px] px-1.5 py-0.2 rounded-full font-bold ${activeTab === 'resolved' ? 'bg-white/20 text-white' : 'bg-white text-[#6E6B5F]'}`}>
                    {resolvedPosts.length}
                  </span>
                </button>
              </div>
            </header>

            <main className="flex-1 px-4 py-4 space-y-3 pb-[calc(2rem+env(safe-area-inset-bottom,0px))]">
              {loading ? (
                <div className="space-y-3">
                  <SkeletonCard />
                  <SkeletonCard />
                  <SkeletonCard />
                </div>
              ) : displayedPosts.length === 0 ? (
                activeTab === 'active' ? (
                  <div className="text-center py-16 bg-white border border-black/7 rounded-xl p-6 shadow-sm">
                    <div className="w-12 h-12 rounded-full bg-[#F3F1EB] flex items-center justify-center mx-auto mb-3 text-[#A8A49A]">
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                      </svg>
                    </div>
                    <h2 className="text-base font-bold text-[#1C1B18] mb-1">No active posts</h2>
                    <p className="text-xs text-[#6E6B5F]">You have no items currently open or under verification.</p>
                  </div>
                ) : (
                  <div className="text-center py-16 bg-white border border-black/7 rounded-xl p-6 shadow-sm">
                    <div className="w-12 h-12 rounded-full bg-[#F3F1EB] flex items-center justify-center mx-auto mb-3 text-[#A8A49A]">
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    </div>
                    <p className="text-xs font-semibold text-[#6E6B5F]">Resolved posts will appear here.</p>
                  </div>
                )
              ) : (
                displayedPosts.map((post) => (
                  <PostCard
                    key={post.post_id}
                    post={post}
                    isEditing={editingPostId === post.post_id}
                    onStartEdit={(id) => setEditingPostId(id)}
                    onCancelEdit={() => setEditingPostId(null)}
                    onStatusChange={patchPostStatus}
                    onEditSave={patchPostEdit}
                    onBump={handleBump}
                    onDeleteClick={(p) => setDeletingPost(p)}
                    onViewClaims={(p) => setClaimsDrawerPost(p)}
                    onOpenActionSheet={(p) => setActionSheetPost(p)}
                  />
                ))
              )}
            </main>

            <ClaimsDrawer
              isOpen={Boolean(claimsDrawerPost)}
              onClose={() => setClaimsDrawerPost(null)}
              post={claimsDrawerPost}
              onApproveClaim={(postId, claimId) => actionClaim(postId, claimId, 'approve')}
              onRejectClaim={(postId, claimId) => actionClaim(postId, claimId, 'reject')}
            />

            <ActionSheet
              isOpen={Boolean(actionSheetPost)}
              onClose={() => setActionSheetPost(null)}
              post={actionSheetPost}
              isBumpEligible={checkBumpEligible(actionSheetPost)}
              onEdit={() => {
                if (actionSheetPost) setEditingPostId(actionSheetPost.post_id);
              }}
              onBump={() => {
                if (actionSheetPost) handleBump(actionSheetPost.post_id);
              }}
              onDelete={() => {
                if (actionSheetPost) setDeletingPost(actionSheetPost);
              }}
            />

            <ConfirmDialog
              isOpen={Boolean(deletingPost)}
              onClose={() => setDeletingPost(null)}
              onConfirm={handleConfirmDelete}
              title="Delete this post? This can't be undone."
            />

            {/* Mobile Bottom Navigation Bar */}
            <nav className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-black/7 z-40 pb-[env(safe-area-inset-bottom,0px)] sm:hidden shadow-lg" aria-label="Mobile navigation">
              <div className="grid grid-cols-3 h-14 max-w-md mx-auto">
                <a href="/search" className="flex flex-col items-center justify-center gap-0.5 text-[#6E6B5F] hover:text-[#C96442] font-medium text-[11px] active:scale-95 transition-transform">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <span>Search</span>
                </a>
                <a href="/search" className="flex flex-col items-center justify-center gap-0.5 text-[#6E6B5F] hover:text-[#C96442] font-medium text-[11px] active:scale-95 transition-transform">
                  <div className="w-7 h-7 rounded-full bg-[#C96442] text-white flex items-center justify-center shadow-sm -mt-2.5 border-2 border-white">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 4v16m8-8H4" />
                    </svg>
                  </div>
                  <span>Report</span>
                </a>
                <a href="/my-posts" className="flex flex-col items-center justify-center gap-0.5 text-[#C96442] font-bold text-[11px] active:scale-95 transition-transform">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                  </svg>
                  <span>My Posts</span>
                </a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
